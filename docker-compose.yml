version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pkbm_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-pkbm_digital_darel_iman}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pkbm_backend
    restart: always
    environment:
      PORT: 8080
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:-rootpassword}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-pkbm_digital_darel_iman}
      JWT_SECRET: ${JWT_SECRET:-dar-el-iman-secret-key-2027-2032}
      FRONTEND_URL: "*"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pkbm_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
